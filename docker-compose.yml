version: '3.8'

services:
  muse2api:
    build: .
    image: muse2api:latest
    container_name: muse2api
    restart: always
    ports:
      - "18610:18610"
    environment:
      # 管理与 API 鉴权 Key（从 .env 或宿主环境读取，留空则自动生成）
      - MUSE2API_KEY=${MUSE2API_KEY:-}
      # 服务对外基准 URL，如 https://your-domain.com（留空则管理前端自动检测当前域名）
      - MUSE2API_PUBLIC_BASE=
      - MUSE2API_CORS_ORIGINS=${MUSE2API_CORS_ORIGINS:-https://muse.ai,https://www.muse.ai,http://127.0.0.1:3000,http://localhost:3000}
      - MUSE2API_ALLOW_LEGACY_PUBLIC_MEDIA=${MUSE2API_ALLOW_LEGACY_PUBLIC_MEDIA:-0}
      # 超时配置（秒）
      - MUSE2API_IMAGE_TIMEOUT=240
      - MUSE2API_VIDEO_TIMEOUT=600
      - MUSE2API_CHAT_TIMEOUT=300
      - MUSE2API_CHROMIUM_IDLE_SECONDS=${MUSE2API_CHROMIUM_IDLE_SECONDS:-60}
      - MUSE2API_CONCURRENCY=${MUSE2API_CONCURRENCY:-2}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-}
    volumes:
      # 持久化账号配置、任务日志及媒体文件
      - ./data:/app/data
    shm_size: '2gb' # 保证 Chromium 渲染多标签页时不因 /dev/shm 耗尽崩溃
