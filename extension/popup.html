<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>mac2API 账号连接</title>
<style>
  :root{color-scheme:dark;--bg:#101622;--panel:#151c29;--line:#273243;--text:#eef3fb;--muted:#a4b2c8;--accent:#9cb9ff;--action:#3d67d8}
  *{box-sizing:border-box}
  body{width:380px;margin:0;padding:15px 16px;background:var(--bg);color:var(--text);
    font:13px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
  .popup-meta{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px 10px;margin-bottom:12px}
  .brand{display:flex;align-items:baseline;flex-wrap:wrap;gap:2px 6px;color:var(--accent);font-weight:650}
  #extensionVersion{color:var(--muted);font-size:10.5px;font-weight:500;white-space:nowrap}
  .langsel{max-width:100%;padding:3px 5px;border-radius:7px;border:1px solid var(--line);
    background:var(--panel);color:var(--text);font:inherit;font-size:11px;cursor:pointer}
  h1{font-size:17px;line-height:1.26;letter-spacing:-.02em;margin:0 0 4px}
  .sub,label,details{color:var(--muted);font-size:11.5px}
  .sub{margin:0 0 11px}
  label{display:block;margin:9px 0 4px}
  input:not([type=checkbox]){width:100%;min-width:0;padding:7px 9px;border-radius:8px;border:1px solid var(--line);
    background:var(--panel);color:var(--text);font:12px/1.4 ui-monospace,SFMono-Regular,Consolas,monospace}
  button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .provider-buttons{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:12px}
  button{min-width:0;min-height:34px;padding:6px;border:1px solid transparent;border-radius:8px;
    background:var(--action);color:#fff;font:inherit;font-weight:650;overflow-wrap:anywhere;cursor:pointer}
  button:hover{background:#4674eb}
  button:disabled{opacity:.5;cursor:default}
  #checkConnection{margin-top:6px;width:100%;background:var(--panel);border-color:var(--line)}
  #checkConnection:hover{border-color:var(--accent)}
  details{margin-top:10px;padding-top:9px;border-top:1px solid var(--line);overflow-wrap:anywhere}
  summary{cursor:pointer}
  .steps,.foot{margin:7px 0 0}
  #log{display:none;margin-top:12px;padding:10px 11px;background:var(--panel);border:1px solid var(--line);
    border-radius:9px;font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere}
  #log.show{display:block}
  .ok{color:#61d8aa}.bad{color:#ff9a9f}.warn{color:#f2ca84}
</style>
</head>
<body>
  <header>
    <div class="popup-meta">
      <span class="brand">mac2API <span id="extensionVersion"></span></span>
      <select id="langSel" class="langsel" aria-label="Ngôn ngữ / Language / 语言">
        <option value="vi">Tiếng Việt</option>
        <option value="zh">中文</option>
        <option value="en">English</option>
      </select>
    </div>
    <h1 data-i18n-text>账号连接</h1>
    <p class="sub" data-i18n-text>打开已登录的 AI 标签页，然后选择对应的服务。</p>
  </header>

  <label for="base" data-i18n-text>mac2API 地址</label>
  <input id="base" placeholder="http://127.0.0.1:18610" spellcheck="false">

  <label for="key" data-i18n-text>管理密钥</label>
  <input id="key" type="password" placeholder="m2a_..." spellcheck="false">

  <label for="label" data-i18n-text>账号标签（可留空）</label>
  <input id="label" placeholder="例如 muse-main" spellcheck="false">

  <div class="provider-buttons">
    <button id="go" type="button">Muse</button>
    <button id="linkGemini" type="button">Gemini</button>
  </div>
  <button id="checkConnection" type="button" data-i18n-text>检查连接</button>

  <div id="log" role="status"></div>

  <details>
    <summary data-i18n-text>高级连接设置</summary>
    <label><input id="directChrome" type="checkbox" checked> <span data-i18n-text>使用扩展直接运行 Gemini</span></label>
    <p class="steps" id="directSteps" data-i18n-text>默认连接本机 mac2API，使用当前 Chrome 个人资料。</p>
    <p class="steps" id="cdpSteps" hidden data-i18n-text>通过 Chrome DevTools 连接时，请先在 mac2API 中授权 Chrome。</p>
    <p class="foot" data-i18n-text>只有 Muse 会将 Cookie 发送至填写的 mac2API 地址。</p>
  </details>

  <script src="popup.js"></script>
</body>
</html>
