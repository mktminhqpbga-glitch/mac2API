<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>mac2API 账号连接</title>
<style>
  :root{color-scheme:dark;--bg:#101622;--panel:#151c29;--line:#273243;--text:#eef3fb;--muted:#a4b2c8;--accent:#9cb9ff;--action:#3d67d8}
  *{box-sizing:border-box}
  body{width:380px;max-width:100vw;margin:0;padding:16px 17px 17px;background:var(--bg);color:var(--text);
    font:13px/1.55 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
  h1{font-size:15px;line-height:1.2;letter-spacing:-.02em;margin:0 0 7px;display:flex;align-items:center;gap:8px}
  h1 .dot{width:24px;height:24px;flex:none;display:grid;place-items:center;border-radius:7px;background:#23375e}
  h1 .dot::before{content:"";width:9px;height:9px;border:2px solid #c3d4ff;border-radius:3px;transform:rotate(45deg)}
  h1 .langsel{margin-left:auto;padding:4px 5px;border-radius:7px;border:1px solid var(--line);
    background:var(--panel);color:var(--text);font-size:11px;font-weight:400;cursor:pointer}
  .sub,label,.foot{color:var(--muted);font-size:11.5px}
  .sub{margin:0 0 13px}
  label{display:block;margin:10px 0 4px}
  input{width:100%;padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);
    color:var(--text);font:12.5px ui-monospace,SFMono-Regular,Consolas,monospace}
  button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .provider-buttons{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:13px}
  button{padding:9px 7px;border:1px solid transparent;border-radius:8px;background:var(--action);color:#fff;
    font-size:13px;font-weight:650;cursor:pointer}
  button:hover{background:#4674eb}
  button:disabled{opacity:.5;cursor:default}
  .steps{padding:11px 12px;margin-top:12px;background:var(--panel);border:1px solid var(--line);border-radius:9px;
    color:var(--muted);font-size:11.5px}
  .steps b{color:var(--text)}
  #log{display:none;margin-top:12px;padding:10px 11px;background:var(--panel);border:1px solid var(--line);
    border-radius:9px;font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere}
  #log.show{display:block}
  .ok{color:#61d8aa}.bad{color:#ff9a9f}.warn{color:#f2ca84}
  .foot{margin-top:13px;padding-top:10px;border-top:1px solid var(--line)}
  code{padding:1px 5px;border-radius:4px;background:var(--panel);font-size:11px}
</style>
</head>
<body>
  <h1><span class="dot" aria-hidden="true"></span><span data-i18n-text>mac2API 账号连接</span><span id="extensionVersion" style="font-size:11px;color:var(--muted)">v1.0.7</span>
    <select id="langSel" class="langsel" title="Ngôn ngữ / Language / 语言">
      <option value="vi">Tiếng Việt</option>
      <option value="zh">中文</option>
      <option value="en">English</option>
    </select>
  </h1>
  <p class="sub" data-i18n-text>选择当前标签页对应的服务。</p>

  <label for="base" data-i18n-text>服务地址（BASE URL）</label>
  <input id="base" placeholder="http://your-server-ip:18610" spellcheck="false">

  <label for="key" data-i18n-text>管理密钥</label>
  <input id="key" type="password" placeholder="m2a_..." spellcheck="false">

  <label for="label" data-i18n-text>账号标签（可留空）</label>
  <input id="label" placeholder="例如 muse-main" spellcheck="false">

  <div class="provider-buttons">
    <button id="go" type="button">Muse</button>
    <button id="linkChatGPT" type="button">ChatGPT</button>
    <button id="linkGemini" type="button">Gemini</button>
  </div>

  <label><input id="directChrome" type="checkbox" checked style="width:auto"> <span data-i18n-text>使用扩展直接运行 ChatGPT 和 Gemini</span></label>

  <div class="steps" id="directSteps" data-i18n="direct-steps"><b>打开已登录的 ChatGPT 或 Gemini 标签页。</b><br>输入本机服务地址，点击对应按钮。请保持普通 Chrome 窗口打开。</div>

  <div class="steps" id="cdpSteps" hidden data-i18n="steps"><b>打开已登录的标签页并选择对应服务。</b><br>Muse 导入 Cookie。ChatGPT 和 Gemini 验证 mac2API 同一台机器上已授权 Chrome 的标签页。</div>

  <div id="log" role="status"></div>

  <div class="foot" data-i18n="bridge-foot">Muse 会导入 Cookie。直连扩展模式在 Chrome 已登录的个人资料中运行任务，向 mac2API 返回任务结果。</div>

  <script src="popup.js"></script>
</body>
</html>
